 name: Keep Warm

    on:
      schedule:
        # Runs every 10 minutes
        - cron: "* * * * *"
      workflow_dispatch: # Allow manual trigger

    jobs:
      ping:
        runs-on: ubuntu-latest
        steps:
          - name: Ping health endpoint
            run: |
              curl -sf --max-time 30 "https://razin.tech/health/" || echo "Ping failed"