log_format bench '$remote_addr [$time_local] "$request" $status $request_time '
                 'upstream=$upstream_addr urt=$upstream_response_time';
access_log /var/log/nginx/access.log bench;

upstream api {
    server api1:8000 max_fails=2 fail_timeout=5s;
    keepalive 64;
}

server {
    listen 80;

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
        # 503 is left out on purpose: /health/ answers 503 while Redis is down, and
        # counting that as a failed upstream would eject every instance.
        proxy_next_upstream error timeout http_502 http_504;
        add_header X-Upstream $upstream_addr always;
    }
}
