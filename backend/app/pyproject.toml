[project]
name = "app"
version = "0.1.0"
description = "Chatbot using Mistral API"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=4.0.0",
    "email-validator>=2.0.0",
    "fastapi[standard]>=0.162.0",
    "langchain-text-splitters>=1.1.0",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.0.0",
    "redis>=8.0.0",
    "sqlalchemy>=2.0.0",
    "tiktoken>=0.13.0",
    "pymupdf>=1.27.2.3",
    "aiofiles>=25.1.0",
    "cohere>=7.0.4",
    "langgraph>=1.2.5",
    "httpx>=0.28.1",
    "pinecone>=9.1.0",
    "langchain-core>=1.4.7",
    "mistralai>=3.7.0",
    "langfuse>=5.2.0",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.pyright]
venvPath = "."
venv = ".venv"
