# AUTOMATED TESTS ONLY. Disposable Postgres and Redis for pytest; nothing here is kept.
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   cd backend/app && uv run pytest tests -v
#   docker compose -f docker-compose.test.yml down
#
# Separate from the dev stack on purpose: its own project name, its own ports, bound to
# loopback. The suite truncates tables and flushes Redis, so it must never share either.

name: chatbot-test

services:
  db-test:
    # Must stay on Postgres 18: the schema uses uuidv7(), which is built in from 18.
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: chatbot_test
      POSTGRES_PASSWORD: chatbot_test
      POSTGRES_DB: chatbot_test
    # In memory, so stopping the container empties the database.
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_test -d chatbot_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis-test:
    image: redis:7-alpine
    # No snapshots and no append-only file: nothing is written to disk.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
